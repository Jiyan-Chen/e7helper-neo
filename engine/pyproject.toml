[project]
name = "e7helper"
version = "0.4.0-beta.2"
description = "第七史诗国服 · MuMu 专用助手引擎"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.31.0",
    "fastapi>=0.143.3",
    "uvicorn>=0.30",
    "websockets>=17.2",
]

[project.scripts]
e7helper = "e7helper.cli:app"

# 第三方模块通过 entry-point 组 "e7helper.modules" 注册，见 docs/architecture.md

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
]
# 打包（B10）：python -m uv run --group build python packaging/build.py
build = [
    "pyinstaller>=6.22",
]
# RTA 模型训练（B14b，只在开发机装）：python -m uv run --group train e7helper rta train ...
# 注意：之后再跑不带 --group train 的 uv sync 会把 torch 删掉。GPU 训练另见 tools/setup_rocm_venv.ps1
train = [
    "torch>=2.9",
    "onnx>=1.19",
    "onnxscript>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# rapidocr 依赖 opencv-python-headless，它和 opencv-python 共用 cv2 目录，后装的会覆盖前者，
# 导致 highgui（capture 的框选窗口）不可用。这里把 headless 排除掉，统一用带 GUI 的 opencv-python。
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[[tool.uv.index]]
url = "https://repo.huaweicloud.com/repository/pypi/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["e7helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "device: 需要本机运行中的 MuMu 实例（设置 E7_DEVICE_TESTS=1 启用）",
]
