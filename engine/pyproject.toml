[project]
name = "e7helper"
version = "0.1.0"
description = "第七史诗国服 · MuMu 专用助手引擎"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
e7helper = "e7helper.cli:app"

# 第三方模块通过 entry-point 组 "e7helper.modules" 注册，见 docs/architecture.md

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e7helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "device: 需要本机运行中的 MuMu 实例（设置 E7_DEVICE_TESTS=1 启用）",
]
